<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angol jegyzet</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d9;--ex:#f0eee7;--mk:#ffe27a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16161a;--card:#1f1f25;--tx:#ecebe6;--mu:#9b9a94;--bd:#2f2f38;--ex:#27272f;--mk:#7a6417}}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
h1{margin:0 0 8px;font-size:20px}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg)}
main{max-width:820px;margin:0 auto;padding:14px}
#cnt{color:var(--mu);font-size:13px;margin:0 0 8px}
section{margin-bottom:28px}
section>h2{font-size:18px;margin:0 0 10px;padding-left:10px;border-left:5px solid hsl(var(--h) 65% 50%)}
section>h2 small{color:var(--mu);font-weight:400;font-size:14px;margin-left:6px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.c h3{margin:0 0 6px;font-size:15px;color:hsl(var(--h) 60% 45%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c h3{color:hsl(var(--h) 70% 70%)}}
.c p{margin:4px 0}
.e{background:var(--ex);border-radius:8px;padding:5px 10px;margin:5px 0;font-size:15px}
.w{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.w span{background:var(--ex);border-radius:8px;padding:2px 9px;font-size:14px}
mark{background:var(--mk);color:inherit;border-radius:3px}
#none{display:none;text-align:center;color:var(--mu);padding:40px 0}
</style>
</head>
<body>
<header>
<h1>📘 Angol jegyzet <a href="https://claude.ai/artifact/6e9obQLq1j8Binz6HmNXnA" target="_blank" rel="noopener" style="font-size:14px;font-weight:400;margin-left:8px;color:inherit">✍️ Gyakorló</a></h1>
<input id="q" type="search" placeholder="Keresés… (pl. always, still, think, tomorrow, szoktam)" autocomplete="off">
<div id="chips"></div>
</header>
<main>
<p id="cnt"></p>
<div id="out"></div>
<div id="none">Nincs találat 🤷</div>
</main>
<script>
var S=[
{id:"ab",name:"Alapok",hu:"To be, do, have",h:260,c:[
{t:"Személyes névmások",w:["I = én","You = te / ti","He = ő (fiú)","She = ő (lány)","It = ez / az (tárgy, állat)","We = mi","They = ők"]},
{t:"To be (lenni): jelen idő",e:["I am · You are · He / She / It is · We are · You are · They are","Rövidítések: I'm, You're, He's, She's, It's, We're, You're, They're","Tagadás: I'm not · You aren't · He / She / It isn't · We aren't · You aren't · They aren't","Kérdés: Am I? · Are you? · Is he / she / it? · Are we? · Are you? · Are they?"]},
{t:"To be: múlt idő (was / were)",e:["I was · You were · He / She / It was · We were · You were · They were","Tagadás: I wasn't · You weren't · He / She / It wasn't · We weren't · They weren't","Kérdés: Was I? · Were you? · Was he / she / it? · Were we? · Were they?"]},
{t:"Do (csinál): jelen idő",e:["I / You / We / They do · He / She / It does","Tagadás: I don't · He / She / It doesn't …","Kérdés: Do I / you / we / they …? · Does he / she / it …?"],n:["FONTOS! DO NOT = DON'T, DOES NOT = DOESN'T. Don't után NEM írunk még egy not-ot."]},
{t:"Do: helyes / helytelen",e:["✅ I don't work.","❌ I don't not work."]},
{t:"Have: jelen és múlt",e:["I / You / We / They have · He / She / It has","Tagadás: I don't have · He / She / It doesn't have","Kérdés: Do I have? · Does he have?","Múlt: have / has → had","I had a car. (Volt egy autóm.)","I didn't have a car. (Nem volt autóm.)","Did you have a car? (Volt autód?)"]},
{t:"Legfontosabb szabályok (összefoglaló)",e:["TO BE: I → am, He / She / It → is, You / We / They → are","DO: I / You / We / They → do, He / She / It → does","HAVE: I / You / We / They → have, He / She / It → has","WAS / WERE: I / He / She / It → was, You / We / They → were","PAST SIMPLE: I worked. / I didn't work. / Did you work?"]}
]},
{id:"pa",name:"Past Simple",hu:"Egyszerű múlt",h:0,c:[
{t:"Mikor használjuk?",n:["Olyan cselekvésre, ami a múltban történt és befejeződött."],w:["yesterday","last week","last month","last year","ago","in 2020"]},
{t:"Állító mondat",n:["Kétféle ige létezik. Szabályos: -ed végződést kap. Rendhagyó: meg kell tanulni."],e:["work → worked","play → played","watch → watched","clean → cleaned","go → went","eat → ate","drink → drank","see → saw","buy → bought","do → did","have → had","come → came"]},
{t:"Tagadás: didn't + alapige",n:["FONTOS! Didn't után mindig az ige ALAPALAKJA áll."],e:["I didn't work.","I didn't go.","She didn't play."]},
{t:"Kérdés: Did + alany + alapige",e:["Did you work?","Did she go?","Did they play?","❌ Did you went","✅ Did you go"]}
]},
{id:"qw",name:"Kérdőszavak",hu:"Question words",h:180,c:[
{t:"Kérdőszavak",e:["What = Mi? Mit?","Who = Ki?","Whom = Kit?","Whose = Kié?","Where = Hol? Hová?","When = Mikor?","Why = Miért?","Which = Melyik?","How = Hogyan?","How much = Mennyi?","How many = Hány?","How old = Hány éves?","How often = Milyen gyakran?","How long = Mennyi ideig?","How far = Milyen messze?","How tall = Milyen magas?","What time = Hány órakor?","What kind of = Milyen fajta?"]}
]},
{id:"vc",name:"Szójegyzék",hu:"Szavak",h:50,c:[
{t:"seldom",e:["seldom = ritkán"]},
{t:"at noon",e:["at noon = délben (12:00)"]},
{t:"Hobbi, sport",w:["photography = fotózás","cycling = biciklizés","bicycle = bicikli","to cycle = biciklizni"]},
{t:"Test, egészség",n:["Az órai jegyzetben a surgeon mellett „műtő” állt, de a surgeon jelentése sebész (a műtét: surgery).","ligament = ízületi szalag; ribbon = szalag (pl. díszszalag)."],w:["ankle = boka","elbow = könyök","ankle ligament = bokaszalag","torn / rip = elszakad","ribbon = szalag","surgeon = sebész","surgery = műtés","medicine = gyógyszer","anxious = stresszes (szorongó)","anxiety = idegesség (szorongás)"]},
{t:"Utazás, csomagolás",w:["flight = repülőjárat","train = vonat","boarding pass = beszállókártya","holiday home = nyaraló","wallet = pénztárca","phone = telefon","battery = elem","medicine = gyógyszer","cosmetic bag","toiletry bag (piperetáska)"],e:["5 most important things to take"]},
{t:"Ruhák, tárgyak (többes számú!)",n:["Ezek többes számú szavak, ezért: ARE."],w:["pants = nadrág","trousers = nadrág","jeans = farmer","shoes = cipő","socks = zokni","glasses = szemüveg","sunglasses = napszemüveg","headphones = fejhallgató"],e:["The sunglasses ARE over there."]},
{t:"Egyéb szavak",w:["Friday = péntek","It passes = elmegy (elmúlik)","to study for something = valamire tanulni","language exam = nyelvvizsga","shore = part","on the shore of = valaminek a partján","China = Kína","French = francia","theory = elmélet","highway code = KRESZ","before = előtt","just before summer = épp nyár előtt"]},
{t:"just",e:["just = csak · éppen · éppen most · pont · csupán"]}
]},
{id:"eg",name:"Egyéb nyelvtan",hu:"Dátum, find, will",h:330,c:[
{t:"Dátum: amerikai és brit",n:["from July = júliustól"],e:["October 3rd = amerikai","the 3rd October = brit"]},
{t:"find + tárgy + melléknév",n:["Valamit valamilyennek tartok."],e:["I find China interesting. (érdekesnek tartom Kínát)","I find England boring."]},
{t:"will (jövő)",e:["I will go to Finland.","When = mikor"]},
{t:"Többes számú tárgyak",e:["The sunglasses ARE over there."]}
]},
{id:"ps",name:"Present Simple",hu:"Egyszerű jelen",h:210,c:[
{t:"Használata",n:["Rendszeres, szokásosan ismétlődő cselekvésekre és állandó állapotokra.","Pl.: have, live, speak (English)"]},
{t:"Szerkezet",e:["(+) A + V1 (he, she, it: **-s** rag)","(−) A + don't / doesn't + V1 (segédige)","(?) (Kérdőszó) + do / does + A + V1"]},
{t:"Gyakoriság határozók",n:["Alany és az ige között! (always / all the time: mondat végén is állhat)"],w:["always / all the time","usually","never","hardly ever","sometimes","often","rarely (ritkán)","seldom (ritkán)","generally","normally","regularly (rendszeresen)"],e:["I always eat eggs for breakfast.","I never play football.","Kati hardly ever eats chocolate.","We usually go to bed at midnight.","They often look after my child.","I sometimes eat fish."]},
{t:"Gyakoriság határozó: létige után",n:["Létige (be) és segédige után jönnek."],e:["I'm always tired.","She's usually happy.","We can never win.","They don't often go out.","Do you always watch TV?"]},
{t:"Mondat végi időhatározók",w:["every day / week / month / summer / year","on Mondays","in the morning(s)","in the afternoon(s)","in the evening(s)","in March / April","at night","at midnight","at noon / midday (dél)","at the weekend"]},
{t:"Hányszor? (a day / week / year)",n:["hányszor + a + day / week / year"],w:["once","twice","3-tól: times"],e:["My brother drinks milk once a week.","How often do you go running? – I go running 4 times a week.","How many times a year do you go on holiday?"]},
{t:"Jövő idő: menetrend, program",n:["Egyszerű jelent jövő időben is használunk, ha az esemény programhoz, időbeosztáshoz, menetrendhez van kötve."],w:["start","begin","finish","end","open","close","leave","arrive (megérkezik)"],e:["My bus leaves at 5.","When does your plane leave? (Mikor indul a géped?)","When do the shops close in this town?","When does the film start? – Fél óra múlva. It starts in 30 minutes."]},
{t:"go + -ing-es ige",w:["go running","swimming","dancing","shopping","cycling","hunting","horseriding","sailing","hiking","climbing","jogging","surfing","diving"],e:["I always go swimming at the weekend. (egyszerű jelen)","Most: I'm going swimming now. (folyamatos jelen)"]},
{t:"like / love / hate / enjoy + -ing",n:["-ing-es igével: statikus, nem folyamatos."],e:["I like cooking. (egyszerű jelen)","I like going dancing."]},
{t:"Házimunka: do the …",w:["do the cleaning","washing up","cooking","dusting","vacuuming","ironing"],e:["My mum hates doing the ironing."]},
{t:"too often / very often",n:["Mondat végén áll, tagadásba illik."],e:["I don't go to the cinema too often."]},
{t:"Szoktam = used to ?",n:["Az angolban a used to csak régi szokásra használható.","Ma is zajló cselekvésre tilos, így nem lehet lefordítani: egyszerű jelent használj."],e:["Nem szoktam tv-t nézni: I don't watch TV.","Jane szokott zenét hallgatni: Jane listens to music.","Do your parents go dancing?"]},
{t:"What … like? / What do you do?",n:["What + létige + alany + like? = Milyen …?","What + do/does + alany + like? = Mit szeret?","What + do/does + alany + look like? = Hogy néz ki?"],e:["What is the weather like?","What is your dog like? – He is brown.","What was the vacation like?","What do you like?","What does your sister like? – She likes candy.","What do you do? = What's your job?"]},
{t:"Útbaigazítás, kommentálás",n:["Útbaigazításnál, kommentálásnál, mű / könyv / film ismertetésénél egyszerű jelent használunk. (Lásd még: Here comes / There goes.)"],e:["First you turn left, then you go straight on to the bank.","Ronaldo passes the ball to Kaka."]}
]},
{id:"pc",name:"Present Continuous",hu:"Folyamatos jelen",h:150,c:[
{t:"Használata",n:["Ha a cselekvést éppen most művelik, vagy éppen most zajlik valami.","Statikus igék nem lehetnek folyamatos igeidőben (lásd: Statikus igék)."]},
{t:"Szerkezet",e:["(+) A + létige (am, is, are) + -ing-es ige","My sister is playing with her dog now.","(−) A + létige + not + -ing-es ige","I'm not watching TV, I'm studying.","(?) (Kérdőszó) + létige + A + -ing-es ige","Why are you crying?","Who are you waiting for?","What are you looking at?","Who is your husband dancing with?","What are you doing?","What do you do? (ez egyszerű jelen = foglalkozás)"]},
{t:"Elnyújtott jelen",n:["A cselekvés lehet elnyújtott jelen is!"],e:["I'm studying English at school.","Gina is writing a novel."]},
{t:"A szokásostól eltérő cselekvés",e:["I usually start work at 8, but this week I'm starting at 9."]},
{t:"Idegesítő cselekvés (always)",n:["Always: főként egyszerű jelennel használjuk, de ha idegesítő, folyton ismétlődik: folyamatos."],e:["I always read before I go to bed. (egyszerű jelen)","He's always inviting his friends in the evening. (folyton áthívja a barátait)"]},
{t:"still = még mindig",e:["It's still raining.","Are you still listening to music?"]},
{t:"getting + melléknév = változás",e:["It's getting late.","It's getting cold.","She's getting old."]},
{t:"Fix jövő (megszervezett terv)",n:["A folyamatos jelent jövő időként is használhatjuk, ha a jövőbeli esemény meg van szervezve, le van fixálva.","Mindig van a mondatban 1 jövőre utaló időhatározó. Ha valaki fix programjára kérdezel rá: folyamatos jelen."],e:["I'm flying to Rome next week.","Are you going to school tomorrow?","What are you doing this summer?"]},
{t:"Időhatározók",w:["now","at the moment","nowadays","at present","right now","today","tonight (fix jövő)","next week (fix jövő)"]}
]},
{id:"st",name:"Statikus igék",hu:"Nem lehetnek folyamatos igeidőben",h:20,c:[
{t:"Statikus igék listája",n:["Ezek nem lehetnek folyamatos igeidőben."],w:["hear","see","think *","be *","like","love","hate","dislike","want","need","mean *","promise","know","realise","understand","remember","forget","prefer","cost","taste","smell","come","have","look"],e:["* = bizonyos jelentésben mégis lehet -ing-es (lásd lent)"]},
{t:"think",n:["Ha véleményt alkotunk (szerintem, azt hiszem, úgy gondolom): statikus.","Ha gondolkodni, fontolgatni: lehet -ing-es. Of után, \"mindig\" jelentésnél egyszerű jelen."],e:["I think the weather is cold.","What are you doing? – I am thinking.","I always think of my ex-wife.","I'm thinking of moving to Pécs. (fontolgatom)"]},
{t:"mean",e:["What does this word mean?","What do you mean? – Ezt hogy érted?","Do you really mean it? – Komolyan gondolod?","This job means a lot to me.","I didn't mean to hurt you.","intention – szándék"]},
{t:"see",n:["I see you = I can see you (látlak most). Can-nel szokott állni.","Lefixált találkozást is jelenthet (= meet): folyamatos."],e:["I can't / don't see the screen.","Do you / Can you see this man?","I'm seeing my boss tomorrow. = I'm meeting my boss."]},
{t:"be",n:["Általános jellemző: egyszerű. Ideiglenes, a szokásostól eltérő viselkedés: being."],e:["She is very impatient. (általában)","She is being impatient. (most, szokatlanul)","She is usually patient."]},
{t:"taste / smell",n:["Ha az adott tárgyból jön a szag / íz: STATIKUS.","Ha a cselekvő érez / ízlel: lehet folyamatos."],e:["The chicken tastes lovely.","Your perfume smells wonderful.","Look, the dog is tasting your dinner.","I always taste my mother's cakes.","Why are you smelling my soup?","Why does she always smell your coffee?"]},
{t:"come",n:["Ha \"jönni\": bármely igeidő. Ha származást jelent: statikus."],e:["Wait for me, I'm coming.","She never comes to visit.","She comes from Spain. = She is from Spain."]},
{t:"have",n:["Birtoklás: statikus. Have + tevékenység: lehet -ing-es."],e:["I have 3 children.","I'm having a shower.","She doesn't have a shower every night."]},
{t:"look",n:["Kinézni valahogy: statikus."],e:["She looks beautiful tonight.","Why are you looking at me?"]}
]},
{id:"hc",name:"Here comes / There goes",hu:"Itt jön / Ott megy",h:300,c:[
{t:"Szabály",n:["Itt jön a busz: egyszerű jelen, holott MOST történik (folyamatos jelen kellene, de mégis Present Simple).","Az angolban egyenes szórend uralkodik (The bus is coming), de itt kivételesen FORDÍTOTT: nyomatékosítás van.","Előre hozzuk a helyhatározót, utána fordított szórend: helyhatározó + ige + alany."],e:["Here comes the bus.","There go the girls. (Ott mennek a lányok.)"]},
{t:"Névmással: egyenes szórend",n:["Ha az alany névmás: A – Á (alany – ige)."],e:["Here it comes.","There they go. (Ott mennek ők.)","There he goes."]},
{t:"Példák",e:["The bus is coming. = Here comes the bus.","Here come my kids.","Here they come.","There goes your bus.","There it / he / she goes."]},
{t:"Élő közvetítés",n:["Folyamatos jelen kellene (épp most), DE: egyszerű jelent kell használni."],e:["Perez passes the ball to Gomez.","Ronaldo passes the ball to Kaka."]}
]}
];
var ap=function(s){return s.replace(/'/g,"’")};
S.forEach(function(s){s.c.forEach(function(c){["n","e","w"].forEach(function(k){if(c[k])c[k]=c[k].map(ap)});c.t=ap(c.t);
c.txt=(c.t+" "+(c.n||[]).concat(c.e||[],c.w||[]).join(" ")).replace(/\*/g,"").toLowerCase()});s.txt=(s.name+" "+s.hu).toLowerCase()});
var cur=S[0].id,$=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(s,q){var h=esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
if(q){var r=new RegExp("(<[^>]+>)|("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");h=h.replace(r,function(m,t,x){return t?t:"<mark>"+x+"</mark>"})}return h}
function chips(){var h='';
S.forEach(function(s){h+='<button class="chip'+(cur==s.id?" on":"")+'" data-id="'+s.id+'">'+s.name+'</button>'});$("chips").innerHTML=h}
function render(){var q=ap($("q").value.trim()),ql=q.toLowerCase(),out="",n=0;
S.forEach(function(s){if(!ql&&cur!=s.id)return;var cs=s.c.filter(function(c){return !ql||c.txt.indexOf(ql)>-1});
if(!cs.length)return;n+=cs.length;
out+='<section style="--h:'+s.h+'"><h2>'+s.name+'<small>'+s.hu+'</small></h2>';
cs.forEach(function(c){out+='<div class="c"><h3>'+fmt(c.t,q)+'</h3>';
(c.n||[]).forEach(function(x){out+='<p>'+fmt(x,q)+'</p>'});
if(c.w)out+='<div class="w">'+c.w.map(function(x){return'<span>'+fmt(x,q)+'</span>'}).join("")+'</div>';
(c.e||[]).forEach(function(x){out+='<div class="e">'+fmt(x,q)+'</div>'});out+='</div>'});out+='</section>'});
$("out").innerHTML=out;$("none").style.display=n?"none":"block";$("cnt").textContent=q?n+" találat":"";chips()}
$("q").addEventListener("input",render);
$("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(b){cur=b.dataset.id;render();window.scrollTo(0,0)}});
render();
</script>
</body>
</html>
